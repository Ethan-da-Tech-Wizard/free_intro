<!-- Purpose: Page shell for the demo app: sets the page metadata, loads the stylesheet and app script, and provides the empty containers that web/app.js fills in. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Page metadata: colour of the browser toolbar on phones, and the description shown by search and share tools. -->
  <meta name="theme-color" content="#126e61">
  <meta name="description" content="A working automation showcase. Follow one piece of information across independent workplace apps, with real API traces and before-and-after evidence.">
  <title>Relayworks · From busywork to flow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23126e61'/%3E%3Cpath d='M10 13h12l-5 7h13M10 27h12l-5-7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <!-- Styles and the script (a module) are served from the /assets/ path, which maps to the web folder. -->
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <!-- Skip link for keyboard and screen-reader users; the app container shows a loading message until app.js draws the first screen. -->
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"><div class="loading-screen"><span class="brand-mark">↗</span><p>Opening your demonstration workspace…</p></div></div>
  <!-- Live region for short status messages, and the dialog element used for pop-up forms. -->
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
</body>
</html>
