<!doctype html>
<html lang="en">

<!-- How this file fits the app: the one HTML document of the Relayworks portal, served by app/server.py for
     / and /workplace. It is an empty shell on purpose: web/app.js (loaded as an ES module) builds every
     screen into #app, so the page works only with JavaScript (there is no <noscript> fallback here).
     Same-origin assets only, which the server's Content-Security-Policy requires: styles at
     /assets/styles.css, script at /assets/app.js, and the favicon is an inline data: SVG.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#126e61">
  <meta name="description" content="A working automation showcase. Follow one piece of information across independent workplace apps, with real API traces and before-and-after evidence.">
  <title>Relayworks · From busywork to flow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23126e61'/%3E%3Cpath d='M10 13h12l-5 7h13M10 27h12l-5-7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>

  <!-- Skip link for keyboard users; it is hidden until focused (see .skip in styles.css) and jumps to #main,
       which web/app.js renders inside the shell.
  -->
  <a class="skip" href="#main">Skip to content</a>

  <!-- Mount point: shows the loading message until web/app.js replaces its content (home page, scenario
       pages, workplace pages all render here).
  -->
  <div id="app"><div class="loading-screen"><span class="brand-mark">↗</span><p>Opening your demonstration workspace…</p></div></div>

  <!-- Transient message area (aria-live=polite so screen readers announce it); web/app.js toast() shows text
       here for five seconds.
  -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Native <dialog> element used for modals (source preview, mapping, confirmations); opened and closed
       from web/app.js modal().
  -->
  <dialog id="modal"></dialog>
</body>
</html>
